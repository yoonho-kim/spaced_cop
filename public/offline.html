<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#9117cf" />
  <title>Space D Offline</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Noto Sans KR", system-ui, sans-serif;
      background: #050816;
      color: #f7f8fc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(145, 23, 207, 0.32), transparent 38%),
        linear-gradient(180deg, #090b14 0%, #050816 100%);
    }

    main {
      width: min(100%, 420px);
      padding: 28px 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: rgba(9, 11, 20, 0.84);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
      text-align: center;
    }

    img {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.5rem;
    }

    p {
      margin: 0;
      line-height: 1.6;
      color: rgba(247, 248, 252, 0.78);
    }

    button {
      margin-top: 22px;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font: inherit;
      color: #fff;
      background: linear-gradient(135deg, #9117cf 0%, #c43ff6 100%);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/pwa-192x192.png" alt="Space D" />
    <h1>오프라인 상태입니다</h1>
    <p>이 화면은 네트워크 연결이 없을 때 표시됩니다. 연결이 복구되면 새로고침해서 다시 진행해 주세요.</p>
    <button type="button" onclick="window.location.reload()">다시 시도</button>
  </main>
</body>
</html>
